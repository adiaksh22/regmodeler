name: Daily FAA source check
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faa-reviewed-source-checks
  cancel-in-progress: false
jobs:
  import:
    # Enable only after credential approval and a successful manual run.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SOURCE_CHECKS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FAA_DRS_API_KEY: ${{ secrets.FAA_DRS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check PA-28 TCDS metadata delta
        run: npm run check:tcds -- --certificate=2A13
      - name: Check Boeing 737 TCDS metadata delta
        if: ${{ !cancelled() }}
        run: npm run check:tcds -- --certificate=A16WE
      - name: Check PA-28 AD metadata delta
        if: ${{ !cancelled() }}
        run: npm run check:related -- --type=AD
      - name: Check PA-28 STC metadata delta
        if: ${{ !cancelled() }}
        run: npm run check:related -- --type=STC
      - name: Check Boeing 737 AD metadata delta
        if: ${{ !cancelled() }}
        run: npm run check:related -- --scope=B737 --type=AD
      - name: Check Boeing 737 STC metadata delta
        if: ${{ !cancelled() }}
        run: npm run check:related -- --scope=B737 --type=STC
