name: FAA TCDS import
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify FAA metadata only, without writing to Supabase
        type: boolean
        default: true
      certificate:
        description: Type certificate data sheet number
        type: choice
        options: [2A13, A16WE]
        default: A16WE
permissions:
  contents: read
concurrency:
  group: faa-tcds-import-${{ inputs.certificate }}
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAA_DRS_API_KEY: ${{ secrets.FAA_DRS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CERTIFICATE: ${{ inputs.certificate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify source contract
        if: inputs.verify_only && inputs.certificate == '2A13'
        run: npm run import:verify
      - name: Verify family source contract
        if: inputs.verify_only && inputs.certificate != '2A13'
        run: npm run import:tcds:family -- --certificate="$CERTIFICATE" --verify-only
      - name: Archive and import revisions
        if: ${{ !inputs.verify_only && inputs.certificate == '2A13' }}
        run: npm run import:tcds
      - name: Archive and import family revisions
        if: ${{ !inputs.verify_only && inputs.certificate != '2A13' }}
        run: npm run import:tcds:family -- --certificate="$CERTIFICATE"
